# Clash 配置管理器 Nginx 反向代理配置（HTTP，默认）
#
# 由 compose.yaml 通过绑定挂载注入到容器内 /etc/nginx/conf.d/default.conf。
# 本文件是独立的 nginx 配置，变量直接写 $host / $remote_addr 等，无需 compose 的 $$ 转义。
#
# 启用 HTTPS：执行 `bash scripts/setup-ssl.sh <域名> <邮箱>`，
# 脚本会签发证书并用 nginx/default.https.conf 覆盖本文件。

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 校验（供 scripts/setup-ssl.sh 使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # app 为 compose 中应用服务的名称，端口固定 5000
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
