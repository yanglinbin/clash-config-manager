  url: http://connectivitycheck.gstatic.com/generate_204
  tolerance: 500
  interval: 60
  use: *id002
  filter: (?i)(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*(?:Japan|JP|日本|Tokyo)
- name: 美国
