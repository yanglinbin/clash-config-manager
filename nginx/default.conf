# Clash 配置管理器 Nginx 反向代理配置
# 由 compose.yaml 通过绑定挂载到容器内 /etc/nginx/conf.d/default.conf
#
# 注意：本文件是独立的 nginx 配置（不再内联在 compose 文件中），
# 因此变量直接写 $host / $remote_addr 等，无需 compose 的 $$ 转义。

server {
    listen 80;
    server_name _;

    location / {
        # app 为 compose 中应用服务的名称，端口固定 5000
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
