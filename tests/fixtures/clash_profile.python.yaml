proxy-providers:
  IKUUU:
    type: http
    url: https://example.com/subscription
    interval: 3600
    path: ./providers/IKUUU.yaml
    health-check:
      enable: true
      url: http://connectivitycheck.gstatic.com/generate_204
      interval: 300
proxy-groups:
- name: 海外代理
  type: select
  proxies:
  - 香港
  - 台湾
  - 日本
  - 美国
  - 新加坡
  - DIRECT
  use: &id001
  - IKUUU
  filter: (?i)^(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*
- name: F1TV
  type: select
  proxies:
  - 美国
  - 香港
  - 台湾
  - 日本
  - 新加坡
  - DIRECT
  use: *id001
  filter: (?i)^(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*
- name: 全球直连
  type: select
  proxies:
  - DIRECT
  - 香港
  - 台湾
  - 日本
  - 美国
  - 新加坡
  use: *id001
  filter: (?i)^(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*
- name: 漏网之鱼
  type: select
  proxies:
  - DIRECT
  - 香港
  - 台湾
  - 日本
  - 美国
  - 新加坡
  use: *id001
  filter: (?i)^(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*
- name: 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 香港
  type: url-test
  url: http://connectivitycheck.gstatic.com/generate_204
  tolerance: 500
  interval: 60
  use: &id002
  - IKUUU
  filter: (?i)(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*(?:Hong\
    Kong|HK|香港|HongKong)
- name: 台湾
  type: url-test
  url: http://connectivitycheck.gstatic.com/generate_204
  tolerance: 500
  interval: 60
  use: *id002
  filter: (?i)(?!.*(?:网址|剩余|流量|重置|套餐|如遇|永久|官方|群组|欢迎|官网|频道|个人|到期|续费|免费)).*(?:Taiwan|TW|台湾|Taipei)
- name: 日本
