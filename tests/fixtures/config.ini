# ============================================================
# 测试用配置（不含真实订阅链接）
#
# 与仓库根目录 config/config.ini 的结构、并对输出有影响的取值保持一致，
# 用于在 CI 等无 config.ini 的环境中复现黄金文件（tests/fixtures/clash_profile.python.yaml）。
# 订阅链接为占位值（订阅链接模式不会去拉取）。
# ============================================================

[proxy_providers]
ikuuu = https://example.com/subscription
liangxin = https://example.com/subscription-2

[provider_control]
active_provider = ikuuu

[regions]
香港 = Hong Kong,HK,香港,HongKong
台湾 = Taiwan,TW,台湾,Taipei
日本 = Japan,JP,日本,Tokyo
美国 = United States,US,美国,America,USA
新加坡 = Singapore,SG,新加坡,狮城

[filter]
exclude_keywords = 网址,剩余,流量,重置,套餐,如遇,永久,官方,群组,欢迎,官网,频道,个人,到期,续费,免费

[files]
rules_config = config/rules.yaml

[clash]
port = 7890
socks_port = 7891
allow_lan = true
mode = Rule
log_level = info
external_controller = :9090
test_url = http://connectivitycheck.gstatic.com/generate_204

[merged_regions]
default_type = url-test

[custom_groups]
#AI专用 = fallback, , 香港|日本|美国, AI平台|Copilot

[main_proxy_region_groups]
#AI平台 = manual
#全球直连 = manual

[relay_groups]
#name = 统一代理
#type = fallback
#regions = 香港,台湾,日本,美国,新加坡

[relay_groups_targets]
##海外代理 = 1
##游戏平台 = 1

[proxy_group_defaults]
海外代理 = 香港
F1TV = 美国
漏网之鱼 = DIRECT
广告拦截 = DIRECT
全球直连 = DIRECT
