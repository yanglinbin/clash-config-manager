# Clash 配置管理器 —— 宿主机 Nginx 反向代理参考配置（HTTPS）
#
# 说明：compose 不再内置 Nginx，应用仅绑定 127.0.0.1:5000。
# 本文件供宿主机 Nginx 参考（放到你的 nginx conf.d 下），按需调整证书路径与域名。
#
# 证书（自行获取，路径按宿主机实际情况修改）：
#   /etc/nginx/certs/cert.crt   证书（含中间证书链）
#   /etc/nginx/certs/cert.key   私钥
#
# 修改后：nginx -t && nginx -s reload

# 80：全部跳转到 HTTPS
server {
    listen 80;
    server_name clash.yilabao.top;
    return 301 https://$host$request_uri;
}

# 443：TLS 终止并反向代理到 app
server {
    listen 443 ssl;
    http2 on;
    server_name clash.yilabao.top;

    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 可选：确认全站 HTTPS 无误后再开启 HSTS
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # 应用容器映射到宿主机 127.0.0.1:5000
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
