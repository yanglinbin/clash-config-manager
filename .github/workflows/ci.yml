name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-test:
    name: 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 构建必须早于 lint:rules / generate：它们运行的是 dist/ 下的编译产物
      - name: 构建
        run: npm run build

      - name: 类型检查
        run: npm run typecheck

      - name: 规则 lint
        run: npm run lint:rules

      - name: 单元测试
        run: npm test

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            public/js
          retention-days: 7

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clash-config-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
