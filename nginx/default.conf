# Clash 配置管理器 Nginx 反向代理配置（HTTPS）
#
# 证书由你自行获取，以文件方式放到 ./nginx/certs/ 下（compose 只读挂载到容器 /etc/nginx/certs）：
#   nginx/certs/cert.crt   证书（含中间证书链）
#   nginx/certs/cert.key   私钥
# 若文件名不同，改下面的 ssl_certificate / ssl_certificate_key 路径即可。
#
# 修改 server_name 为你的域名后生效：
#   docker compose up -d --force-recreate nginx
#
# 本文件是独立的 nginx 配置，变量直接写 $host / $remote_addr 等。

# 80：全部跳转到 HTTPS
server {
    listen 80;
    server_name clash.yilabao.top;
    return 301 https://$host$request_uri;
}

# 443：TLS 终止并反向代理到 app
server {
    listen 443 ssl;
    http2 on;
    server_name clash.yilabao.top;

    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 可选：确认全站 HTTPS 无误后再开启 HSTS
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # app 为 compose 中应用服务的名称，端口固定 5000
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
