# Clash 配置管理器 Nginx 反向代理配置（HTTPS 模板）
#
# 用法：由 scripts/setup-ssl.sh 将 __DOMAIN__ 替换为实际域名后，
# 覆盖到 nginx/default.conf：
#   sed "s/__DOMAIN__/clash.example.com/g" nginx/default.https.conf > nginx/default.conf
#   docker compose restart nginx
#
# 证书目录（容器内）：/etc/letsencrypt/live/<域名>/
# 对应宿主机目录：./nginx/letsencrypt（compose 只读挂载）

# 80：ACME 校验 + 跳转到 HTTPS
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443：TLS 终止并反向代理到 app
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 可选：HSTS（确认全站 HTTPS 后再开启）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
